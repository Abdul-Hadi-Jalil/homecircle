<script>
  (function() {
    const syncLabel = document.getElementById('sync-label');
    if (!syncLabel) return;
    
    const statusSequence = [
      "Syncing household routine...",
      "Updating pantry inventory...",
      "Gathering family calendar...",
      "Welcome back home"
    ];
    let step = 0;
    
    setInterval(() => {
      step = (step + 1) % statusSequence.length;
      syncLabel.style.opacity = '0';
      syncLabel.style.transform = 'translateY(2px)';
      syncLabel.style.transition = 'opacity 200ms ease, transform 200ms ease';
      
      setTimeout(() => {
        syncLabel.textContent = statusSequence[step];
        syncLabel.style.opacity = '1';
        syncLabel.style.transform = 'translateY(0)';
      }, 200);
    }, 2400);
  })();
