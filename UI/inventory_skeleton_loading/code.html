<!-- Custom Keyframe Definition via Inline JS for Zero Dependency Shimmer -->
<script>
    (function() {
      // Inject Shimmer animation safely if not present
      if (!document.getElementById('skeleton-shimmer-styles')) {
        const style = document.createElement('style');
        style.id = 'skeleton-shimmer-styles';
        style.innerHTML = `
          @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
          }
        `;
        document.head.appendChild(style);
      }

      // Micro-interaction: allow clicking toast to toggle simulated finish state
      const toast = document.getElementById('feedback-toast');
      const actionBtn = document.getElementById('toast-action');
      let isSaving = true;

      toast.addEventListener('click', function() {
        if (isSaving) {
          isSaving = false;
          toast.querySelector('.font-title-md').textContent = 'All updates saved!';
          toast.querySelector('.font-label-sm').textContent = 'Household pantry is current';
          const spinner = toast.querySelector('.animate-spin');
          if (spinner) {
            spinner.className = 'w-5 h-5 rounded-full bg-secondary text-on-secondary flex items-center justify-center shrink-0';
            spinner.innerHTML = '<span class="material-symbols-outlined text-[14px]">check</span>';
          }
          actionBtn.disabled = false;
          actionBtn.classList.remove('cursor-not-allowed', 'opacity-60', 'bg-surface-variant/20', 'text-outline-variant');
          actionBtn.classList.add('bg-primary-container', 'text-on-primary-container', 'hover:opacity-90');
          actionBtn.textContent = 'Done';
        } else {
          isSaving = true;
          toast.querySelector('.font-title-md').textContent = 'Saving inventory changes...';
          toast.querySelector('.font-label-sm').textContent = 'Syncing with household devices';
          const checkIcon = toast.querySelector('.bg-secondary');
          if (checkIcon) {
            checkIcon.className = 'w-5 h-5 rounded-full border-2 border-primary-fixed-dim/30 border-t-primary-fixed animate-spin shrink-0';
            checkIcon.innerHTML = '';
          }
          actionBtn.disabled = true;
          actionBtn.className = 'px-space-sm py-1.5 rounded-lg bg-surface-variant/20 text-outline-variant font-label-md text-label-md cursor-not-allowed opacity-60';
          actionBtn.textContent = 'Undo';
        }
      });
    })();
