services:
  - type: web
    name: homecircle-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.lock
    startCommand: python -m uvicorn app.main:create_app --factory --loop app.core.event_loop:create_event_loop --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.17
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSLMODE
        value: verify-full
      - key: DATABASE_SSLROOTCERT
        value: certs/supabase-root-2021.pem
      - key: DATABASE_POOL_MIN
        value: "1"
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: INVITATION_PEPPER
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "[]"
